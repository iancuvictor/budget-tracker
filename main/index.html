<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav id="navbar">
      <div class="nav_empty"></div>
      <h1>BUDGET TRACKER</h1>
      <div class="nav_right">
        <a href="https://github.com/iancuvictor/budget-tracker" target="_blank">Github</a>
        <a href="https://www.linkedin.com/in/iancuvictoriuliu/" target="_blank">Linkedin</a>
      </div>
    </nav>
    <div id="mainWrapper">
      <div id="tableWrapper">
        <div id="incomes">
          <div class="header">
            <h2>INCOMES</h2>
            <button id="createIncomeBtn">Add revenue source</button>
          </div>
          <ul id="incomeList">
          </ul>
          <span>Total revenue: <input id="totalIncome" disabled/>RON</span>
          <!-- <button id="calculateIncomeBTN">Calculate Income</button> -->
        </div>
        <div id="expenses">
          <div class="header">
            <h2>EXPENSES</h2>
            <button id="createExpenseBtn">Add an expense</button>
          </div>
          <ul id="expenseList">
          </ul>
          <span>Total expenses: <input id="totalExpense" disabled/>RON</span>
          <!-- <button id="calculateExpenseBTN">Calculate Income</button> -->
        </div>
      </div>
      <div id="resultsWrapper">
        <span class="result">Brute savings: <input id="bruteSavings" step="0.00" disabled></span>
        <span id="financial_result"></span>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
