<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav id="navbar">
      <h1>BUDGET TRACKER</h1>
      <a href="#"></a>
    </nav>
    <div id="mainWrapper">
      <div id="incomes">
        <h2>INCOMES</h2>
        <ul id="incomeList">
          <li>
            <label>Rent:</label>
            <input type="number" placeholder="0,00" />
          </li>
          <li>
            <label>Food:</label>
            <input type="number" placeholder="0,00" />
          </li>
        </ul>
        <span>Total revenue: </span>
      </div>
      <div id="expenses">
        <h2>EXPENSES</h2>
        <ul id="expenseList">
          <li>
            <label>Rent:</label>
            <input type="number" placeholder="0,00" />
          </li>
          <li>
            <label>Food:</label>
            <input type="number" placeholder="0,00" />
          </li>
        </ul>
        <span>Total expenses: </span>
      </div>
    </div>
    <button id="createExpenseBtn">Add an expense</button>
    <button id="createIncomeBtn">Add revenue source</button>
    <script src="../scripts/script.js"></script>
  </body>
</html>
