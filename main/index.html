<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav id="navbar">
      <h1>BUDGET TRACKER</h1>
      <a href="#"></a>
    </nav>
    <div id="mainWrapper">
      <div id="incomes">
        <h2>INCOMES</h2>
        <ul id="incomeList">
        </ul>
        <span>Total revenue: <input id="totalIncome" disabled/></span>
        <button id="createIncomeBtn">Add revenue source</button>
        <button id="calculateIncomeBTN">Calculate Income</button>
      </div>
      <div id="expenses">
        <h2>EXPENSES</h2>
        <ul id="expenseList">
        </ul>
        <span>Total expenses: <input id="totalExpense" disabled/></span>
        <button id="createExpenseBtn">Add an expense</button>
        <button id="calculateExpenseBTN">Calculate Income</button>
      </div>
    </div>
    <script src="../scripts/script.js"></script>
  </body>
</html>
